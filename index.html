  /* ================= Log time: the day (v0.9 blocks) and one block (create / edit) ================= */
  function findDay(tc, date) { var x = null; tc.week.days.forEach(function (d) { if (d.date === date) x = d; }); return x; }

  /** #log/<date>[/<email>] : the day's blocks, or straight to the form when nothing is logged yet. */
  function renderLog(date, email) {
    date = date || S.boot.today;
    var mine = !email || email === S.boot.user.email;
    app.innerHTML = '<div class="loading">Loading&#x2026;</div>';
    call('apiTimeCard', date, mine ? '' : email).then(function (tc) {
      if (mine && tc.week.isCurrent) S.tc = tc;
      var day = findDay(tc, date);
      if (!day || !day.blocks.length) drawLog(date, null, mine ? '' : email, tc, day);
      else drawDay(date, day, mine ? '' : email, tc);
    }).catch(fail);
  }

  /** #blk/<date>/<entryId | new>[/<email>] : one block. */
  function renderBlock(date, id, email) {
    var mine = !email || email === S.boot.user.email, base = mine ? '' : '/' + encodeURIComponent(email);
    app.innerHTML = '<div class="loading">Loading&#x2026;</div>';
    call('apiTimeCard', date, mine ? '' : email).then(function (tc) {
      var day = findDay(tc, date), e = null;
      if (day && id !== 'new') day.blocks.forEach(function (b) { if (b.id === id) e = b; });
      if (id !== 'new' && !e) { toast('That block was not found.'); go('#log/' + date + base); return; }
      drawLog(date, e, mine ? '' : email, tc, day);
    }).catch(fail);
  }

  /** Big Clock in / Clock out for my own today (Clock in starts a block, Clock out closes it). */
  function clockHtml(tc) {
    var op = tc.openBlock;
    if (op && op.date === tc.today) {
      return '<button type="button" class="btn primary big" id="clockOut">Clock out</button>' +
        '<p class="muted small center" id="clockedSince">Clocked in since ' + esc(op.startLabel) + '</p>';
    }
    if (op) {
      return '<div class="note warn" id="openOld">Your block from ' + esc(op.dateLabel) + ' (since ' + esc(op.startLabel) + ') is still open. ' +
        '<a href="#blk/' + esc(op.date) + '/' + esc(op.id) + '">Add its end time</a> before you clock in again.</div>';
    }
    return '<button type="button" class="btn primary big" id="clockIn">Clock in</button>';
  }
  function wireClock() {
    function done(r, msg) {
      if (r.timeCard.week.isCurrent || !S.tc) S.tc = r.timeCard; else refreshMine();
      var pts = applyPoints(r.points, '#timeCard');
      toast(msg + pts, pts ? 4000 : 2500);
      go('#home');
    }
    if ($('#clockIn')) $('#clockIn').onclick = function () {
      var b = $('#clockIn'); b.disabled = true; primeAudio();
      call('apiClockIn', '').then(function (r) { done(r, 'Clocked in at ' + r.entry.startLabel + '.'); })
        .catch(function (err) { b.disabled = false; fail(err); });
    };
    if ($('#clockOut')) $('#clockOut').onclick = function () {
      var b = $('#clockOut'); b.disabled = true; primeAudio();
      call('apiClockOut').then(function (r) { done(r, 'Clocked out. ' + fmtH(r.entry.hours) + ' this block.'); })
        .catch(function (err) { b.disabled = false; fail(err); });
    };
  }

  function drawDay(date, day, email, tc) {
    var base = email ? '/' + encodeURIComponent(email) : '', isOff = day.dayType && day.dayType !== 'Work';
    var who = email ? tc.person.name : '';
    var rows = day.blocks.map(function (b) {
      var t = b.dayType !== 'Work' ? b.dayType + ' day' + (b.start ? ', ' + b.startLabel + ' - ' + b.endLabel : '') : blockRange(b);
      var right = b.open ? '<span class="chip">Open</span>' : b.dayType === 'Work' || b.hours ? '<b>' + fmtH(b.hours) + '</b>' : '';
      return '<a class="line blk" href="#blk/' + esc(date) + '/' + esc(b.id) + base + '" data-id="' + esc(b.id) + '">' +
        '<div class="l"><span class="t">' + esc(t) + (b.edited ? ' <span class="muted small">edited</span>' : '') + '</span>' +
        (b.note ? '<span class="s">' + esc(b.note) + '</span>' : '') + '</div>' +
        '<span class="r">' + (b.overAllotment ? '<span class="chip warn">Over</span> ' : '') + right +
        ' <span class="tap" aria-hidden="true">&#8250;</span></span></a>';
    }).join('');
    app.innerHTML = '<h1>' + esc(longDate(date)) + '</h1>' + (who ? '<p class="sub">' + esc(who) + '</p>' : '') +
      (!email && date === tc.today && !isOff ? '<div class="card">' + clockHtml(tc) + '</div>' : '') +
      '<div class="card"><div class="card-head"><h3>' + (isOff ? 'Day off' : 'Time blocks') + '</h3></div>' + rows +
      '<div class="line total"><span>Day total</span><span class="r" id="dayTotal">' + fmtH(day.hours) + '</span></div></div>' +
      (isOff ? '<p class="muted small">A ' + esc(day.dayType.toLowerCase()) + ' day is the only entry for the day. Tap it to change or delete it.</p>'
             : '<a class="btn block big" id="addBlock" href="#blk/' + esc(date) + '/new' + base + '">+ Add block</a>' +
               '<p class="muted small">Tap a block to change or delete it.</p>') +
      '<a class="btn block" href="#week/' + esc(date) + base + '">Back to the week</a>';
    wireClock();
  }

  function drawLog(date, e, email, tc, day) {
    var F = { date: date, dayType: e ? e.dayType : 'Work', start: e ? e.start : '', end: e ? e.end : '',
              note: e ? e.note : '', source: 'Manual' };
    var who = email ? tc.person.name : '', base = email ? '/' + encodeURIComponent(email) : '';
    var others = day ? day.blocks.filter(function (b) { return !e || b.id !== e.id; }) : [];
    var adding = !e && others.length > 0, showTypes = !others.length;
    var clock = !e && !email && date === tc.today && !others.length;
    app.innerHTML = '<h1>' + (e ? 'Change time' : adding ? 'Add a block' : 'Log time') + (who ? ' for ' + esc(who) : '') + '</h1>' +
      (adding ? '<p class="sub">' + esc(longDate(date)) + ' \u00b7 ' + fmtH(day.hours) + ' so far</p>' : '') +
      (clock ? '<div class="card">' + clockHtml(tc) + '<p class="muted small center">or enter the times below</p></div>' : '') +
      '<form id="logForm" class="card" autocomplete="off">' +
      '<label class="field" for="fDate">Date</label><input type="date" id="fDate" value="' + esc(F.date) + '">' +
      (showTypes ? '<label class="field">Day type</label><div class="seg" id="fType">' + S.boot.dayTypes.map(function (t) {
        return '<button type="button" data-t="' + esc(t) + '" class="' + (t === F.dayType ? 'on' : '') + '">' + esc(t) + '</button>';
      }).join('') + '</div>' : '') +
      '<div class="grid2"><div><label class="field" for="fStart">Start</label><input type="time" id="fStart" value="' + esc(F.start) + '"></div>' +
      '<div><label class="field" for="fEnd">End</label><input type="time" id="fEnd" value="' + esc(F.end) + '"></div></div>' +
      '<label class="field" for="fNote">Label (optional)</label><input type="text" id="fNote" maxlength="500" placeholder="office, field, Fryeburg&#x2026; never codes or passwords" value="' + esc(F.note) + '">' +
      '<div class="spread" style="margin-top:12px"><span>Hours</span><span class="hours" id="fHours">-</span></div>' +
      (e ? '<label class="field" for="fReason">Reason for the change (required)</label><input type="text" id="fReason" maxlength="300" placeholder="Example: forgot to log my start">' : '') +
      '<div id="offWarn"></div>' +
      '<button type="submit" class="btn primary big" id="saveBtn" style="margin-top:14px">Save</button>' +
      '</form>' +
      (e ? '<div class="actions"><button class="btn" id="histBtn">History</button><button class="btn danger" id="delBtn">Delete this ' +
        (e.dayType === 'Work' ? 'block' : 'day') + '</button></div><div id="hist"></div>' : '') +
      (others.length ? '<a class="btn block" href="#log/' + esc(date) + base + '">Back to the day</a>'
                     : '<p class="muted small" style="margin-top:12px">Split day? Save this block, then add the next one. The day total adds them up.</p>');

    var typeBtns = $all('#fType button');
    function curType() { var b = $('#fType button.on'); return b ? b.getAttribute('data-t') : F.dayType; }
    function remainingFor(type) {
      if (email || !S.tc || (type !== 'Sick' && type !== 'Vacation')) return null;
      if (String($('#fDate').value).slice(0, 4) !== String(S.tc.timeOff.year)) return null;
      return S.tc.timeOff[type === 'Sick' ? 'sick' : 'vacation'].remaining;
    }
    function update() {
      var s = toMin($('#fStart').value), en = toMin($('#fEnd').value), t = curType();
      var h = '-';
      if (s !== null && en !== null && en > s) h = fmtH((en - s) / 60); // hours = end minus start (no unpaid break)
      else if (t !== 'Work' && s === null && en === null) h = 'day off';
      else if (e && e.open && s !== null && en === null) h = 'open';
      $('#fHours').textContent = h;
      var rem = remainingFor(t), changingInto = !e || e.dayType !== t;
      $('#offWarn').innerHTML = (rem !== null && rem <= 0 && changingInto)
        ? '<div class="note warn">You have no ' + t.toLowerCase() + ' days left this year. You can still save; it will be flagged for Doug and Duane.</div>' : '';
    }
    typeBtns.forEach(function (b) {
      b.onclick = function () { typeBtns.forEach(function (x) { x.classList.toggle('on', x === b); }); update(); };
    });
    ['fStart', 'fEnd', 'fDate'].forEach(function (id) { $('#' + id).addEventListener('input', update); $('#' + id).addEventListener('change', update); });
    if (clock) wireClock();
    update();

    $('#logForm').onsubmit = function (ev) {
      ev.preventDefault();
      var t = curType();
      var input = { entryId: e ? e.id : '', email: email || '', date: $('#fDate').value, dayType: t, start: $('#fStart').value,
                    end: $('#fEnd').value, note: $('#fNote').value, source: F.source,
                    reason: e ? $('#fReason').value : '' };
      if (e && input.reason.trim().length < 3) {
        // allow a no-op save without a reason; otherwise ask for one
        var same = e.date === input.date && e.dayType === t && e.start === input.start && e.end === input.end &&
                   !e.breakMin && e.note === input.note.trim();
        if (!same) { toast('Please say why you are changing this entry.', 4000); $('#fReason').focus(); return; }
      }
      var rem = remainingFor(t);
      if (rem !== null && rem <= 0 && (!e || e.dayType !== t)) {
        if (!window.confirm('You have ' + Math.max(0, rem) + ' ' + t.toLowerCase() + ' days left this year. Save anyway? It will be flagged for Doug and Duane.')) return;
      }
      var btn = $('#saveBtn'); btn.disabled = true; btn.textContent = 'Saving\u2026';
      if (!email) primeAudio();
      call('apiSaveEntry', input).then(function (r) {
        if (!email) { if (r.timeCard.week.isCurrent || !S.tc) S.tc = r.timeCard; else refreshMine(); }
        glow(btn);
        var pts = email ? '' : applyPoints(r.points, '#timeCard');
        toast((r.warning || (r.unchanged ? 'No changes.' : r.created ? 'Saved.' : 'Change saved.')) + pts, r.warning ? 7000 : pts ? 4000 : 2500);
        go(email ? '#log/' + r.entry.date + '/' + encodeURIComponent(email) : (r.entry && r.entry.date === S.boot.today ? '#home' : '#log/' + r.entry.date));
      }).catch(function (err) { btn.disabled = false; btn.textContent = 'Save'; fail(err); });
    };
    if (e) {
      $('#histBtn').onclick = function () {
        call('apiEntryHistory', e.id).then(function (h) {
          $('#hist').innerHTML = '<div class="card"><h3>History</h3>' + h.map(function (x) {
            return '<div class="line"><div class="l"><span class="t">' + esc(x.action) + (x.field && x.field !== '(all)' ? ': ' + esc(x.field) : '') +
              (x.oldValue || x.newValue ? ' <span class="muted small">' + esc(x.oldValue) + ' &#8594; ' + esc(x.newValue) + '</span>' : '') + '</span>' +
              '<span class="s">' + esc(x.at) + ' by ' + esc(x.by) + (x.reason ? ' &#183; "' + esc(x.reason) + '"' : '') + '</span></div></div>';
          }).join('') + '</div>';
        }).catch(fail);
      };
      $('#delBtn').onclick = function () {
        var what = e.dayType === 'Work' ? 'block' : 'day';
        var reason = window.prompt('Why are you deleting this ' + what + '? (required)');
        if (reason === null) return;
        if (reason.trim().length < 3) { toast('A reason is required.'); return; }
        call('apiDeleteEntry', e.id, reason).then(function (r) {
          if (!email) refreshMine();
          toast('Deleted.' + (email ? '' : applyPoints(r.points)));
          go('#log/' + date + base);
        }).catch(fail);
      };
    }
  }

  function renderPoints() {
    app.innerHTML = '<div class="loading">Loading&#x2026;</div>';

      S.points = p; drawPill();

      var tiers = p.tiers.map(function (t) {
        var can = p.redemptionsEnabled && p.available >= t.points;
        return '<div class="line tierline"><div class="l"><span class="t">' + esc(t.reward) + '</span><span class="s">' + esc(t.points) + ' points' +
          (p.available < t.points ? ' &#183; ' + esc(t.points - p.available) + ' to go' : '') + '</span></div>' +
          (p.redemptionsEnabled ? '<span class="r"><button type="button" class="btn small redeem" data-id="' + esc(t.id) + '"' + (can ? '' : ' disabled') +
            '>Redeem</button></span>' : '') + '</div>';
      }).join('');
      // v1.1: points come off when you ask; a denied or cancelled request gives them back.
      var REQ_STATUS = { Requested: 'Requested &#183; waiting for review', Approved: 'Approved', Fulfilled: 'Given',
                         Denied: 'Denied &#183; points returned', Cancelled: 'Cancelled &#183; points returned' };
      var reqs = (p.redemptions || []).map(function (r) {
        return '<div class="line reqline"><div class="l"><span class="t">' + esc(r.reward) + ' (' + esc(r.points) + ' pts)</span><span class="s">' +
          (REQ_STATUS[r.status] || esc(r.status)) + ' &#183; ' + esc(r.requestedAt) + (r.note ? ' &#183; ' + esc(r.note) : '') + '</span></div>' +
          (r.status === 'Requested' ? '<span class="r"><button type="button" class="btn small cancelreq" data-id="' + esc(r.id) + '">Cancel</button></span>' : '') + '</div>';
      }).join('');
      app.innerHTML = '<h1>My points</h1><p class="sub">Only you see your points. There are no rankings.</p>' +
        (p.enabled ? '' : '<div class="note warn" id="pointsOff">Points are turned off right now.</div>') +
        '<div class="card bigpts"><div class="ptsbig"><span class="ptsval" id="myBalance">' + esc(p.balance) + '</span><span class="u">points</span></div>' +
        '<div class="muted">Lifetime ' + esc(p.lifetime) + (p.held ? ' &#183; ' + esc(p.held) + ' on an older request' : '') + '</div>' +
        '<div class="streak" id="myStreak">' + (k ? '&#128293; ' + esc(k) + '-day streak' : 'No streak yet') +
        (p.streak.grace ? ' &#183; ' + esc(plural(p.streak.graceLeft, 'grace day')) + ' left this month' : '') + '</div></div>' +
        '<div class="card"><h3>Rewards</h3>' + (p.redemptionsEnabled ? '' :
          '<div class="note" id="trackingOnly">Tracking only for now: your points are counted and kept. ' + esc(S.boot.app.contactNames) + ' will turn on reward requests later.</div>') +
        (tiers || '<p class="muted">No rewards set yet.</p>') + '</div>' +
        (reqs ? '<div class="card"><h3>My requests</h3>' + reqs + '</div>' : '') +
        '<div class="card"><h3>How points work</h3>' + p.rules.filter(function (r) { return r.key !== 'STREAK_GRACE_PER_MONTH'; }).map(function (r) {
          return '<div class="line"><div class="l"><span class="t">' + esc(r.label) + '</span></div><span class="r">+' + esc(r.value) + '</span></div>';
        }).join('') + '<p class="muted small">Log a Work day on the same day you worked it (backdating earns nothing). Sick, vacation and holidays never break a streak. ' +
          esc(plural(p.streak.grace, 'missed workday')) + ' a month is forgiven. Points come only from saved entries and slips.' +
          (p.startDate ? ' Counting since ' + esc(p.startDate) + '.' : '') + '</p></div>' +
        '<div class="card"><h3>History</h3>' + (p.history.length ? p.history.map(function (x) {
          return '<div class="line"><div class="l"><span class="t">' + esc(x.label) + '</span><span class="s">' + esc(x.at) + '</span></div>' +
            '<span class="r">' + (x.pts > 0 ? '+' : '') + esc(x.pts) + '</span></div>';
        }).join('') : '<p class="muted">Nothing yet. Log today\'s time today for your first point.</p>') + '</div>' +
        '<label class="toggle card" for="soundOn"><span>Sound when I earn points</span><input type="checkbox" id="soundOn"' + (muted() ? '' : ' checked') + '></label>';
      $('#soundOn').onchange = function () { if (this.checked) lsDel('mute'); else lsSet('mute', '1'); toast(this.checked ? 'Sound on.' : 'Sound off.'); };
      $all('.redeem').forEach(function (b) {
        b.onclick = function () {
          var t = p.tiers.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
          if (!t) return;
          var noSignal = 'Needs a signal to request a reward';
          if (window.navigator && window.navigator.onLine === false) { toast(noSignal, 4000); return; } // never queued offline
          if (!window.confirm('Use ' + t.points + ' points for ' + t.reward + '? Doug will be emailed.')) return;
          b.disabled = true;
          call('apiRedeem', t.id).then(function (r) {
            toast((r && r.deducted || t.points) + ' points taken off. Your request was sent to Doug.', 5000); renderPoints();
          }).catch(function (err) {
            b.disabled = false;
            if (/^OFFLINE/.test(String(err && err.message || err))) { toast(noSignal, 4000); return; }
            fail(err);
          });
        };
      });
      $all('.cancelreq').forEach(function (b) {
        b.onclick = function () {
          if (!window.confirm('Cancel this request? Your points come back.')) return;
          call('apiCancelRedeem', b.getAttribute('data-id')).then(function () { toast('Request cancelled. Points returned.', 3000); renderPoints(); }).catch(fail);
        };
      });
    }).catch(fail);
  }

          '<div><label class="field" for="ntPts">Points</label><input type="number" id="ntPts" min="1" step="1"></div>' +
          '<div><label class="field" for="ntVal">Rough $ value</label><input type="number" id="ntVal" min="0" step="1"></div></div>' +
          '<label class="field" for="ntReward">Reward</label><input type="text" id="ntReward" maxlength="80" placeholder="Example: $100 gift card">' +
          '<button class="btn primary block" type="submit" style="margin-top:12px">Add reward</button></form>' +
        '<div class="card"><h3>Point rules</h3>' + d.rules.map(function (r) {
          return '<form class="rulef" data-k="' + esc(r.key) + '"><label class="field">' + esc(r.label) + '</label><div class="row">' +
            '<input type="number" name="v" min="0" step="1" value="' + esc(r.value) + '" style="flex:1"><button class="btn small" type="submit">Save</button></div>' +
            '<div class="muted small">Default ' + esc(r.dflt) + '. 0 turns it off.</div></form>';
        }).join('') +
        '<form class="rulef" data-k="POINTS_HOLIDAYS"><label class="field">Company holidays (not required workdays)</label><div class="row">' +
          '<input type="text" name="v" value="' + esc(d.holidays) + '" placeholder="2026-11-26, 2026-12-25" style="flex:1"><button class="btn small" type="submit">Save</button></div></form>' +
        '<form class="rulef" data-k="POINTS_START_DATE"><label class="field">Points counted since</label><div class="row">' +
          '<input type="date" name="v" value="' + esc(d.startDate) + '" style="flex:1"><button class="btn small" type="submit">Save</button></div></form>' +
        '<p class="muted small">Nightly check (about 12:30 AM): ' + (d.trigger ? 'installed' : 'not installed, run setup() in the editor') + '.</p></div>' +
        '<div class="card"><h3>Open requests</h3>' + (d.open.length ? d.open.map(function (r) {
          return '<div class="req" data-id="' + esc(r.id) + '"><div class="line"><div class="l"><span class="t">' + esc(r.name) + ': ' + esc(r.reward) + '</span>' +
            '<span class="s">' + esc(r.points) + ' pts (already taken off) &#183; ' + esc(r.status) + ' &#183; ' + esc(r.requestedAt) + '</span></div></div>' +
            '<input type="text" class="rnote" maxlength="200" placeholder="Note (optional, no card numbers)"><div class="actions">' +
            (r.status === 'Requested' ? '<button class="btn primary rdo" data-a="approve" type="button">Approve</button><button class="btn rdo" data-a="deny" type="button">Deny</button>'
              : '<button class="btn primary rdo" data-a="fulfill" type="button">Mark given</button>') + '</div></div>';
        }).join('') : '<p class="muted">None.</p>') +
        (d.recent.length ? '<details><summary class="linklike">Past requests</summary>' + d.recent.map(function (r) {
          return '<div class="muted small">' + esc(r.requestedAt) + ' ' + esc(r.name) + ': ' + esc(r.reward) + ' (' + esc(r.points) + ') ' + esc(r.status) + '</div>';
        }).join('') + '</details>' : '') + '</div>';
      $('#toggleRedeem').onclick = function () {
        var to = d.redemptionsEnabled ? 'No' : 'Yes';
        if (to === 'Yes' && !window.confirm('Turn on reward requests? Techs will see a Redeem button on rewards they can afford.')) return;
        call('apiModSaveSetting', 'REDEMPTIONS_ENABLED', to).then(function () { toast('Saved.'); renderModRewards(); }).catch(fail);
      };
      $all('form.tierf').forEach(function (f) {
        var id = f.getAttribute('data-id');
        f.onsubmit = function (ev) {
          ev.preventDefault();
          call('apiModSaveTier', { id: id, points: fld(f, 'pts').value, reward: fld(f, 'reward').value, estValue: fld(f, 'val').value, active: fld(f, 'active').checked })
            .then(function () { toast('Reward saved.'); renderModRewards(); }).catch(fail);
        };
        $('.tup', f).onclick = function () { call('apiModMoveTier', id, -1).then(renderModRewards).catch(fail); };
        $('.tdown', f).onclick = function () { call('apiModMoveTier', id, 1).then(renderModRewards).catch(fail); };
        $('.trm', f).onclick = function () {
          if (!window.confirm('Remove this reward? Requests already made keep their record.')) return;
          call('apiModRemoveTier', id).then(function () { toast('Removed.'); renderModRewards(); }).catch(fail);
        };
      });
      $('#addTier').onsubmit = function (ev) {
        ev.preventDefault();
        call('apiModSaveTier', { points: $('#ntPts').value, reward: $('#ntReward').value, estValue: $('#ntVal').value, active: true })
          .then(function () { toast('Reward added.'); renderModRewards(); }).catch(fail);
      };
      $all('form.rulef').forEach(function (f) {
        f.onsubmit = function (ev) {
          ev.preventDefault();
          call('apiModSaveSetting', f.getAttribute('data-k'), fld(f, 'v').value).then(function () { toast('Saved. Applies going forward.'); renderModRewards(); }).catch(fail);
        };
      });
      $all('.req').forEach(function (el) {
        $all('.rdo', el).forEach(function (b) {
          b.onclick = function () {
            var a = b.getAttribute('data-a');
            if (a === 'deny' && !window.confirm('Deny this request? The points go back to them and they get an email.')) return;
            call('apiModDecideRedemption', el.getAttribute('data-id'), a, $('.rnote', el).value)
              .then(function () { toast(a === 'deny' ? 'Denied. Points returned.' : a === 'approve' ? 'Approved. They get an email.' : 'Saved.', 3000); renderModRewards(); }).catch(fail);
          };
        });
      });
    }).catch(fail);
  }

  start();
})();
</script>

</body>
</html>
