  /* ================= Generator service (v1.4) =================
   * Tools > Generator service, in the app (GENERATOR-PLAN.md). Shown only when the server says so (S.boot.generatorMode
   * 'inapp': Settings > GENERATOR_MODE inapp = everyone, mods = moderators only, link = nobody: the tile opens the old
   * Generator Service app as before). Its one-line hooks end in "// v1.4 gen-hook" (the Tools page and a tool page).
   * v1.5 (Gibs Nov 4): no Home card (the tool is reached from Tools only); no link to the old app (it is off).
   *  - Today's loop: each tech picks their own loop; remembered on this phone for today. Stops with status chips
   *    (Done today / Waiting to upload / Not saved), Navigate (Google Maps, the address on file; no GPS anywhere).
   *  - A stop: Customer / Generator / History, folded. The service form: checklist Yes/No, parts, engine hours, error
   *    codes, notes, missing generator info (fills blanks only). Photos: Tools > Picture gallery (needs signal).
   *  - Search (works with no signal) and "Not serviced this year" (by town A to Z, names A to Z inside each town).
   *  - Reorder: "Just today" (this phone only) or "Make this the usual order" (refused if someone changed the loop meanwhile).
   *  - Loops and Add a generator: need signal.
   *  - GPS pin (approved Nov 4): where the unit sits on the property. On a stop with no pin (and after a service there):
   *    "Use my location" (the phone's GPS, read ONLY on that tap, high accuracy; over 50 m = warn, try again or use the
   *    map), "Drop pin on map" (needs signal: Leaflet + OpenStreetMap, loaded only then) or "Not now" (for this visit).
   *    A GPS pin works with no signal (it waits to upload). Navigate goes to the pin when there is one. No background
   *    location, no tracking: nothing else ever reads or keeps the phone's location. "Use my location" shows only in the
   *    phone app (the GitHub Pages page itself, https, top level), not on the Apps Script web page (a sandboxed frame).
   *  - Map of today's loop (pinned stops only; needs signal).
   *  - v1.5 inactive customers (Active = No, "not serviced anymore"): left out of today's loop, loop counts, the loop map,
   *    reorder and "Not serviced this year"; search hides them unless "Show inactive (N)". Their records and history
   *    stay. Customer details: "Stop servicing" / "Service again" (needs signal; only the Active cell changes).
   *    Loops (manage): inactive stops greyed with "Remove from loop". LoopStops rows are never removed by themselves.
   * On the phone app the generator copy, services and the usual order go through the offline engine (engine.js); on the
   * Apps Script web page the same calls go straight to the server. Access codes never reach the phone (Generators.gs).
   */
  var GEN_ORIG_TOOL = null;
  var GEN_TOOL = { title: 'Generator service', subtitle: 'Today\'s loop, services and generator records (works without signal)', icon: 'generator',
    action: { type: 'page', render: function (a, b) { renderGen(a, b); } } };
  function genOn() { return !!(S.boot && S.boot.generatorMode === 'inapp'); }
  /** The Tools tile: the in-app tool when it is on for me, else the old app link (unchanged). */
  function genSyncTool() {
    var t = TOOLS.filter(function (x) { return x.id === 'generators'; })[0];
    if (!t) return;
    if (!GEN_ORIG_TOOL) GEN_ORIG_TOOL = { title: t.title, subtitle: t.subtitle, icon: t.icon, action: t.action };
    var src = genOn() ? GEN_TOOL : GEN_ORIG_TOOL;
    t.title = src.title; t.subtitle = src.subtitle; t.icon = src.icon; t.action = src.action;
  }
  function genToolsNote() {
    if (!genOn()) return;
    var n = $all('#app > p.muted.small').filter(function (p) { return /Generator Service app opens in a new tab/.test(p.textContent); })[0];
    if (n) n.textContent = 'Generator service works without signal: today\'s loop, search and the service form. Loops and new generators need signal.';
  }
  function genToday() {
    if (S.tc && S.tc.today) return S.tc.today;
    if (S.boot && S.boot.today) return S.boot.today;
    var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  /** This phone, today: {date, loopId, order: {loopId: [stop keys]}} (a new day starts empty). */
  function genDay() {
    var d = null;
    try { d = JSON.parse(lsGet('gen.day') || 'null'); } catch (e) { d = null; }
    if (!d || d.date !== genToday()) d = { date: genToday(), loopId: '', order: {} };
    if (!d.order) d.order = {};
    return d;
  }
  function genDaySave(d) { lsSet('gen.day', JSON.stringify(d)); }
  function genLoad(force) {
    return call('apiGenSnapshot', force ? 'refresh' : '').then(function (g) { S.gen = g; return g; });
  }
  function genEnc(s) { return encodeURIComponent(String(s || '')); }
  function genName(G, gid) {
    var g = G.generators[gid], c = g && G.customers[g.cid];
    return c ? c.name : (g ? gid : '');
  }
  /** v1.5: a stop / generator whose customer is inactive (Active = No) is not "to be serviced". */
  function genCustInactive(G, cid) { var c = G.customers[cid]; return !!(c && c.active === false); }
  function genGenInactive(G, gid) { var g = G.generators[gid]; return !!(g && genCustInactive(G, g.cid)); }
  function genStopInactive(G, s) {
    if (s.inactive) return true;
    return s.gid && G.generators[s.gid] ? genGenInactive(G, s.gid) : !!(s.cid && genCustInactive(G, s.cid));
  }
  /** The stops to be serviced today: the day's order without inactive customers. */
  function genActiveStops(G, loop, dayOrder) { return genOrdered(loop, dayOrder).filter(function (s) { return !genStopInactive(G, s); }); }
  function genCollator(a, b) { return String(a).localeCompare(String(b), 'en', { sensitivity: 'base', numeric: true }); }

  /* ---- pure helpers (window.WES_GEN_TEST) ---- */
  /** The stop status on this phone: waiting / problem / done (and who did it today). */
  function genStatus(G, gid, today) {
    var L = G.local || {}, st = { wait: false, bad: '', done: false, by: [] };
    (L.pending || []).forEach(function (p) { if (p.gid === gid) st.wait = true; });
    (L.problems || []).forEach(function (p) { if (p.gid === gid && p.type === 'genService') st.bad = p.message; });
    (L.sent || []).forEach(function (p) { if (p.gid === gid && p.date === today) st.done = true; });
    (G.done && G.today === today && G.done[gid] || []).forEach(function (w) { st.done = true; if (st.by.indexOf(w) < 0) st.by.push(w); });
    return st;
  }
  /** The loop's stops in the order for today: this phone's "Just today" order if any (new stops at the end), else the usual. */
  function genOrdered(loop, dayOrder) {
    var stops = loop.stops.slice();
    if (!dayOrder || !dayOrder.length) return stops;
    var by = {}, out = [];
    stops.forEach(function (s) { by[s.key] = s; });
    dayOrder.forEach(function (k) { if (by[k]) { out.push(by[k]); delete by[k]; } });
    stops.forEach(function (s) { if (by[s.key]) out.push(s); });
    return out;
  }
  /** Was it serviced in `year`? The server copy (any ServiceLog row that year) or a service saved on this phone. */
  function genServicedIn(G, gid, year) {
    var g = G.generators[gid];
    if (g && Number(g.lastYear) === year) return true;
    var L = G.local || {};
    return (L.pending || []).concat(L.sent || []).some(function (p) { return p.gid === gid && Number(String(p.date || '').slice(0, 4)) === year; });
  }
  /**
   * Every generator with no service record in `year`, grouped by town A to Z ("(No town)" last), customer names A to Z
   * inside each town (then generator ID). Inactive customers are left out and counted.
   */
  function genNotServiced(G, year) {
    var groups = {}, inactive = 0, total = 0;
    Object.keys(G.generators).forEach(function (gid) {
      if (genServicedIn(G, gid, year)) return;
      var g = G.generators[gid], c = G.customers[g.cid] || null;
      if (c && c.active === false) { inactive++; return; }
      var town = String(c && c.town || '').trim(), key = town || '(No town)';
      (groups[key] = groups[key] || []).push({ gid: gid, name: c ? c.name : gid, address: g.address || (c && c.address) || '', last: g.last || '', town: town });
      total++;
    });
    var towns = Object.keys(groups).sort(function (a, b) {
      if (a === '(No town)') return 1;
      if (b === '(No town)') return -1;
      return genCollator(a, b);
    });
    return { year: year, total: total, inactive: inactive, groups: towns.map(function (t) {
      return { town: t, items: groups[t].sort(function (a, b) { return genCollator(a.name, b.name) || genCollator(a.gid, b.gid); }) };
    }) };
  }
  /** Search the phone's copy: every word must match the name, address, town, phone, IDs, brand, model or serial. */
  function genSearch(G, q) {
    var words = String(q || '').toLowerCase().split(/\s+/).filter(String);
    if (!words.length) return [];
    var out = [];
    Object.keys(G.generators).forEach(function (gid) {
      var g = G.generators[gid], c = G.customers[g.cid] || {};
      var hay = [gid, g.cid, c.name, c.address, c.town, c.phone, String(c.phone || '').replace(/\D/g, ''), g.address, g.brand, g.model, g.serial].join(' ').toLowerCase();
      if (words.every(function (w) { return hay.indexOf(w) >= 0; })) out.push({ gid: gid, name: c.name || gid, address: g.address || c.address || '', town: c.town || '', active: c.active !== false });
    });
    return out.sort(function (a, b) { return genCollator(a.name, b.name) || genCollator(a.gid, b.gid); }).slice(0, 60);
  }
  /** A quick check on the phone (the server checks again): access codes, WiFi passwords and key locations stay out. */
  function genLooksLikeCode(text) {
    return String(text || '').split('\n').some(function (l) {
      return /\b(wi-?fi|password|passcode|passwd|pw)\b/i.test(l) ||
        /\b(gate|door|garage|alarm|lock ?box|keypad|entry|access|security)\b[^\n]{0,20}?(\bcode\b|\bcombo\b|\bpin\b|#|\d{3,})/i.test(l) ||
        /\bkeys?\b[^\n]{0,20}\b(under|behind|above|inside|hidden|in the|on the)\b/i.test(l);
    });
  }
  window.WES_GEN_TEST = { notServiced: genNotServiced, search: genSearch, ordered: genOrdered, status: genStatus, looksLikeCode: genLooksLikeCode,
                         activeStops: genActiveStops };

  /* ---- screens ---- */
  function genChips(st) {
    return (st.bad ? '<span class="chip gen-bad">Not saved</span>' : '') +
      (st.wait ? '<span class="chip gen-wait">Waiting to upload</span>' : '') +
      (!st.wait && st.done ? '<span class="chip solid gen-done">' + esc(st.by.length ? 'Done today: ' + st.by.join(', ') : 'Done today') + '</span>' : '');
  }
  function genTabs(on) {
    var t = [['', 'Today\'s loop'], ['search', 'Search'], ['loops', 'Loops']];
    return '<div class="seg gen-tabs" role="tablist">' + t.map(function (x) {
      return '<button type="button" class="' + (x[0] === on ? 'on' : '') + '" data-go="#tool/generators' + (x[0] ? '/' + x[0] : '') + '">' + esc(x[1]) + '</button>';
    }).join('') + '</div>';
  }
  function genWire() {
    $all('[data-go]').forEach(function (b) { b.onclick = function () { go(b.getAttribute('data-go')); }; });
  }
  function genHead(G, on) {
    var L = G.local || {}, bits = [];
    if (L.phone && !L.online) bits.push('No signal: showing this phone\'s copy');
    if (L.pending && L.pending.length) bits.push(L.pending.length + (L.pending.length === 1 ? ' service' : ' services') + ' waiting to upload');
    return backLink('#tools', 'Tools') + '<h1>Generator service</h1>' + genTabs(on) +
      (bits.length ? '<p class="note gen-offline" id="genOffline">' + esc(bits.join(' \u00b7 ')) + '</p>' : '') +
      ((L.problems || []).length ? '<div class="note gen-badnote" id="genProblems">' + L.problems.map(function (p) {
        return '<div>' + esc(p.type === 'genService' ? 'Service for ' + genName(G, p.gid) + ' (' + (p.gid || '') + ') was not saved: ' :
          p.type === 'genSetPin' ? 'Pin for ' + genName(G, p.gid) + ' (' + (p.gid || '') + ') was not saved: ' : 'Usual order not saved: ') + esc(p.message) + '</div>';
      }).join('') + '<p class="small">Fix it and save again. Tap the sync line to clear this.</p></div>' : '');
  }
  function renderGen(a, b) {
    loading();
    var force = a === 'refresh';
    if (force) a = '';
    genLoad(force).then(function (G) {
      if (!$('#app')) return;
      switch (a || '') {
        case 'pick': return genPick(G);
        case 'stop': return genStop(G, b);
        case 'service': return genServiceForm(G, b);
        case 'search': return genSearchPage(G);
        case 'notdone': return genNotDonePage(G);

    t = t.replace(/\b(?:single|one|1)[\s-]*pole\b|\bs\.?p\.?\b/g, '1p').replace(/\b(?:two|double|2)[\s-]*pole\b|\bd\.?p\.?\b/g, '2p');
    t = t.replace(/\b(\d)\s*-?\s*p\b/g, '$1p');
    t = t.replace(/\bgfi\b/g, 'gfci').replace(/\b(?:brkr|bkr|brk)s?\b/g, 'breaker').replace(/\b(?:rcpt|recep|recept)s?\b/g, 'receptacle');
    t = t.replace(/[^a-z0-9\/.\s]/g, ' ').replace(/(^|[^0-9])\.|\.(?![0-9])/g, '$1 ');
    return t.split(/\s+/).filter(String).map(function (w) {
      return w.length >= 4 && /[a-z]s$/.test(w) && !/ss$/.test(w) ? w.slice(0, -1) : w;
    }).join(' ');
  }
  /** "Same as last visit": the customer guess finish lists use (Util.gs customerFromTitle_), as a key. */
  function matCustomerKey(title) {
    var t = String(title || '').replace(/^\s*finish list:\s*/i, '');
    t = t.replace(/\s+-\s+.*$/, '');
    if (t.indexOf(':') >= 0) t = t.slice(t.lastIndexOf(':') + 1);
    t = t.replace(/^\s*\d+\s*\.\s*/, '').replace(/\?/g, '').replace(/\s+/g, ' ').trim().slice(0, 120);
    return t.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  }
  /** Shorthand: "12/2 x50", "12/2 *50", "50x 12/2" -> {qty: 50, rest: '12/2'}; anything else -> null. */
  function matShorthand(text) {
    var s = String(text || '').trim(), m;
    if ((m = /^(.+?)\s+[x*](\d+(?:\.\d+)?)$/i.exec(s))) return { qty: Number(m[2]), rest: m[1].trim() };
    if ((m = /^(\d+(?:\.\d+)?)[x*]\s+(.+)$/i.exec(s))) return { qty: Number(m[1]), rest: m[2].trim() };
    return null;
  }
  /** Screen-only unit hint (never written to the slip). */
  function matUnit(it, name) {
    if (it && it.u) return it.u;
    var n = String(name || '').toLowerCase();
    if (/\b(box|connector|strap|clamp|fitting|coupling|adapter|adaptor|elbow|bushing|staple|cover|plate|nut|breaker)/.test(n)) return '';
    return /\b(romex|nm-?b?|mc|uf|thhn|thwn|ser|seu|wire|cable|pvc|emt|conduit|flex|liquidtight|smurf)\b|\b\d+\/\d\b/.test(n) ? 'ft' : '';
  }
  function matFmtQty(n) { return String(Math.round(n * 100) / 100); }

  function matPrep(d) {
    var ix = { byId: {}, byKey: {}, star: {}, recent: {} };
    (d.items || []).forEach(function (it) {
      ix.byId[it.id] = it;
      var keys = [matKey(it.n)].concat((it.a || []).map(matKey)).filter(String);
      keys.forEach(function (k) { if (!ix.byKey[k]) ix.byKey[k] = it.id; });
      it.toks = keys.join(' ').split(' ');
      it.lk = keys[0] || '';
    });
    (d.stars || []).forEach(function (id) { ix.star[id] = true; });
    (d.recent || []).forEach(function (id, i) { ix.recent[id] = 10 - i; });
    MAT.ix = ix;
  }
  function matLoad(force) {
    if (MAT.data && !force && Date.now() - MAT.at < 120000) return Promise.resolve(MAT.data);
    if (MAT.loading) return MAT.loading;
    MAT.loading = call('apiMaterials').then(function (d) {
      MAT.loading = null; MAT.data = d; MAT.at = Date.now(); if (d && d.enabled) matPrep(d); return d;
    }, function (err) { MAT.loading = null; if (MAT.data) return MAT.data; throw err; });
    return MAT.loading;
  }
  function matItemFor(name) { var k = matKey(name); return k && MAT.ix && MAT.ix.byKey[k] ? MAT.ix.byId[MAT.ix.byKey[k]] : null; }
  /** One query word against one item word: 2 = starts with it, 1 = one typo (words of 4+ letters), 0 = no. */
  function matTok(q, w) {
    if (w.indexOf(q) === 0) return 2;
    if (q.length < 4 || /\d/.test(q)) return 0;
    var p = w.slice(0, q.length), diff = 0, i;
    if (p.length === q.length) { for (i = 0; i < q.length; i++) if (q.charAt(i) !== p.charAt(i)) diff++; if (diff <= 1) return 1; }
    var a = w.slice(0, q.length - 1); // one letter too many in the query
    for (i = 0; i < q.length; i++) if (q.slice(0, i) + q.slice(i + 1) === a) return 1;
    return 0;
  }
  /** Up to `limit` items for what was typed: every word must match the start of a word of the name or a search word. */
  function matSearch(text, limit) {
    if (!MAT.data || !MAT.data.enabled) return [];
    var sh = matShorthand(text), qk = matKey(sh ? sh.rest : text);
    if (qk.replace(/\s/g, '').length < 2) return [];
    var qt = qk.split(' '), out = [];
    MAT.data.items.forEach(function (it) {
      var s = 0;
      for (var i = 0; i < qt.length; i++) {
        var best = 0;
        for (var j = 0; j < it.toks.length && best < 2; j++) best = Math.max(best, matTok(qt[i], it.toks[j]));
        if (!best) return;
        s += best;
      }
      if (it.lk.indexOf(qk) === 0) s += 3;
      out.push({ it: it, s: s * 100 + (MAT.ix.star[it.id] ? 60 : 0) + (MAT.ix.recent[it.id] || 0) * 2 + Math.min(it.r, 40) });
    });
    out.sort(function (a, b) { return b.s - a.s || (a.it.n < b.it.n ? -1 : 1); });
    return out.slice(0, limit || 5).map(function (x) { return x.it; });
  }

  /**
   * Material rows with type-ahead, - / + and a star, inside `box`. The rows are the slip form's own .mat / .mq / .mi, so
   * the form reads them exactly as before. Adding an item that is already there bumps its qty instead of a second line.
   */
  function matRowsWidget(box) {
    function rows() { return $all('.mat', box); }
    function qtyOf(r) { var v = $('.mq', r).value; return v === '' ? 1 : Number(v) || 0; }
    function sameRow(name, skip) {
      var k = matKey(name);
      if (!k) return null;
      return rows().filter(function (r) { return r !== skip && matKey($('.mi', r).value) === k; })[0] || null;
    }
    function refresh(r) {
      var name = $('.mi', r).value, it = matItemFor(name), st = $('.mstar', r);
      $('.munit', r).textContent = matUnit(it, name);
      if (it) { st.classList.remove('hidden'); st.innerHTML = MAT.ix.star[it.id] ? '&#9733;' : '&#9734;'; st.setAttribute('aria-label', MAT.ix.star[it.id] ? 'Unstar' : 'Star'); }
      else st.classList.add('hidden');
    }
    function hideSug(r) { var g = $('.msug', r); g.innerHTML = ''; g.classList.add('hidden'); }
    function setItem(r, name, qty) {
      var other = sameRow(name, r);
      if (other) {
        $('.mq', other).value = matFmtQty(qtyOf(other) + (qty || qtyOf(r)));
        r.parentNode.removeChild(r);
        refresh(other);
        toast('Already on the slip: qty is now ' + $('.mq', other).value + '.', 2500);
        return other;
      }
      $('.mi', r).value = name;
      if (qty) $('.mq', r).value = matFmtQty(qty);
      hideSug(r); refresh(r);
      return r;
    }
    function showSug(r) {
      var mi = $('.mi', r), text = mi.value, g = $('.msug', r);
      var hits = matSearch(text, 5), sh = matShorthand(text), typed = (sh ? sh.rest : text).trim();
      if (!hits.length || typed.length < 2) { hideSug(r); return; }
      g.innerHTML = hits.map(function (it) {
        return '<button type="button" class="msg" data-id="' + esc(it.id) + '"><span class="t">' + (MAT.ix.star[it.id] ? '&#9733; ' : '') + esc(it.n) + '</span>' +
          '<span class="s">' + esc([matUnit(it, it.n), it.k ? 'used ' + it.k + 'x' : 'new'].filter(String).join(' \u00b7 ')) + '</span></button>';
      }).join('') + '<button type="button" class="msg typed"><span class="t">Use &#8220;' + esc(typed) + '&#8221;</span></button>';
      g.classList.remove('hidden');
      $all('.msg', g).forEach(function (b) {
        b.onmousedown = function (ev) { ev.preventDefault(); }; // keep the keyboard / focus while tapping (desktop)
        b.onclick = function () {
          r._picked = true;
          var id = b.getAttribute('data-id'), it = id ? MAT.ix.byId[id] : null;
          setItem(r, it ? it.n : typed, sh ? sh.qty : 0);
          try { mi.blur(); } catch (e) {}
        };
      });
    }
    function wire(r) {
      var mi = $('.mi', r), mq = $('.mq', r);
      mi.oninput = function () { r._picked = false; showSug(r); refresh(r); };
      mi.onfocus = function () { if (mi.value.trim().length >= 2) showSug(r); };
      mi.onblur = function () {
        setTimeout(function () {
          if (!r.parentNode) return;
          hideSug(r);
          if (r._picked) return;
          var sh = matShorthand(mi.value);
          var hit = sh ? matItemFor(sh.rest) : null; // "12/2 x50": the words match a list item exactly -> its name
          if (sh) setItem(r, hit ? hit.n : sh.rest, sh.qty); else refresh(r);
        }, 350);
      };
      $('.mminus', r).onclick = function () { var q = qtyOf(r); mq.value = matFmtQty(q > 1 ? q - 1 : q); };
      $('.mplus', r).onclick = function () { mq.value = matFmtQty(qtyOf(r) + 1); };
      $('.rm', r).onclick = function () { r.parentNode.removeChild(r); };
      $('.mstar', r).onclick = function () {
        var it = matItemFor(mi.value);
        if (!it) return;
        var on = !MAT.ix.star[it.id];
        matStar(it.id, on).then(function () { rows().forEach(refresh); });
      };
      refresh(r);
    }
    function rowHtml(item, qty) {
      return '<div class="mat matp"><div class="mtop"><input type="text" class="mi" maxlength="120" placeholder="Item: type 2 letters" autocomplete="off"' +
        ' autocapitalize="off" spellcheck="false" value="' + esc(item || '') + '">' +
        '<button type="button" class="btn small mstar hidden" aria-label="Star">&#9734;</button>' +
        '<button type="button" class="btn small rm" aria-label="Remove line">&#215;</button></div>' +
        '<div class="msug hidden"></div>' +
        '<div class="mbot"><button type="button" class="btn small mminus" aria-label="Less">&#8722;</button>' +
        '<input type="number" class="mq" min="0" step="any" inputmode="decimal" placeholder="1" aria-label="Qty" value="' + esc(qty == null ? '' : qty) + '">' +
        '<button type="button" class="btn small mplus" aria-label="More">+</button><span class="munit"></span></div></div>';
    }
    /** add(item, qty, {focus, noBump}): bumps the qty of a line with the same item, else fills an empty line, else adds one. */
    function add(item, qty, o) {
      o = o || {};
      item = String(item || '');
      if (item && !o.noBump) {
        var same = sameRow(item, null);
        if (same) { $('.mq', same).value = matFmtQty(qtyOf(same) + (Number(qty) || 1)); refresh(same); return same; }
        var empty = rows().filter(function (r) { return !$('.mi', r).value.trim() && !$('.mq', r).value; })[0];
        if (empty) { $('.mi', empty).value = item; $('.mq', empty).value = qty == null || qty === '' ? '' : matFmtQty(Number(qty)); refresh(empty); return empty; }
      }
      var div = document.createElement('div'); div.innerHTML = rowHtml(item, qty);
      var r = div.firstChild; box.appendChild(r); wire(r);
      if (o.focus) $('.mi', r).focus();
      return r;
    }
    function lines() {
      return rows().map(function (r) { return { qty: $('.mq', r).value, item: $('.mi', r).value }; })
        .filter(function (l) { return l.item.trim(); });
    }
    return { add: add, lines: lines, refreshAll: function () { rows().forEach(refresh); } };
  }

  function matStar(id, on) {
    var was = !!MAT.ix.star[id];
    if (on) MAT.ix.star[id] = true; else delete MAT.ix.star[id];
    return call('apiMatStar', id, on).then(function (r) {
      MAT.data.stars = r.stars; MAT.ix.star = {}; r.stars.forEach(function (x) { MAT.ix.star[x] = true; });
      toast(on ? 'Starred: it shows at the top of your materials.' : 'Unstarred.', 2000);
    }, function (err) { if (was) MAT.ix.star[id] = true; else delete MAT.ix.star[id]; fail(err); });
  }

  /** The slip form hook: does nothing while the picker is off for this person (the form stays exactly as before). */
  function matPicker(e, detail, odd) {
    if (!matOnBoot()) return;
    var box = $('#mats');
    if (!box || box.getAttribute('data-picker')) return;
    box.setAttribute('data-picker', '1');
    var keep = $all('.mat', box).map(function (m) { return { qty: $('.mq', m).value, item: $('.mi', m).value }; });
    box.innerHTML = '';
    var w = matRowsWidget(box);
    keep.forEach(function (l) { w.add(l.item, l.qty, { noBump: true }); });
    var bar = document.createElement('div');
    bar.id = 'matBar'; bar.innerHTML = '<p class="muted small" id="matLoading">Loading your materials&#x2026;</p>';
    box.parentNode.insertBefore(bar, box);
    var addBtn = $('#addMat');
    addBtn.onclick = function () { w.add('', '', { focus: true, noBump: true }); };
    var save = document.createElement('button');
    save.type = 'button'; save.className = 'linklike small'; save.id = 'matSaveKit'; save.textContent = 'Save these lines as my kit';
    addBtn.parentNode.insertBefore(save, addBtn.nextSibling);
    save.onclick = function () {
      var ls = w.lines();
      if (!ls.length) { toast('Add some materials first.', 3000); return; }
      var name = window.prompt('Name for this kit (only you see it):', '');
      if (!name || !name.trim()) return;
      call('apiMatKitSave', { name: name, shop: false, lines: ls.map(function (l) { return { n: l.item, q: l.qty }; }) }).then(function () {
        toast('Kit saved: ' + name.trim() + '.', 3000); MAT.at = 0;
      }).catch(fail);
    };
    matLoad().then(function (d) {
      if (!$('#matBar')) return;
      if (!d || !d.enabled) { bar.innerHTML = ''; return; }
      w.refreshAll();
      drawMatBar(bar, w, e, odd);
    }).catch(function () {
      if ($('#matLoading')) $('#matLoading').textContent = 'Suggestions show once the app has the materials list (open it once with signal). You can still type items.';
    });
  }

  function drawMatBar(bar, w, e, odd) {
    var d = MAT.data, ix = MAT.ix, ids = [];
    (d.stars || []).concat(d.recent || []).forEach(function (id) { if (ix.byId[id] && ids.indexOf(id) < 0) ids.push(id); });
    ids = ids.slice(0, 12);
    var lv = null, visits = (d.lastVisit || {})[matCustomerKey(odd ? odd.title : e.title)] || [];
    for (var i = 0; i < visits.length && !lv; i++) if (!(visits[i].eventId === (odd ? odd.id : e.id) && (odd || visits[i].date === e.date))) lv = visits[i];
    var kits = d.kits || [];
    bar.innerHTML = (ids.length ? '<div class="mchips" id="matChips">' + ids.map(function (id) {
        return '<button type="button" class="chip mchip" data-id="' + esc(id) + '">' + (ix.star[id] ? '&#9733; ' : '') + esc(ix.byId[id].n) + '</button>';
      }).join('') + '</div>' : '<p class="muted small" id="matHint">Type 2 letters in an item to see suggestions. Shorthand: 12/2 x50 = 50 of 12/2.</p>') +
      '<div class="row mrow">' +
      (kits.length ? '<button type="button" class="btn small" id="matKits">Kits (' + kits.length + ')</button>' : '') +
      (lv ? '<button type="button" class="btn small" id="matLast">Same as last visit: ' + esc(lv.customer) + ', ' + esc(shortDate(lv.date)) +
        ' (' + lv.lines.length + ')</button>' : '') + '</div><div id="matKitList" class="hidden"></div>';
    $all('.mchip', bar).forEach(function (b) {
      b.onclick = function () { var it = ix.byId[b.getAttribute('data-id')]; if (it) { w.add(it.n, 1); toast(it.n + ' added.', 1500); } };
    });
    if ($('#matLast')) $('#matLast').onclick = function () {
      lv.lines.forEach(function (l) { w.add(l.n, l.q); });
      toast(lv.lines.length + ' line' + (lv.lines.length === 1 ? '' : 's') + ' from the last visit added. Remove any you did not use.', 4000);
    };
    if ($('#matKits')) $('#matKits').onclick = function () {
      var kl = $('#matKitList');
      if (!kl.classList.contains('hidden')) { kl.classList.add('hidden'); return; }
      kl.innerHTML = kits.map(function (k, i) {
        return '<button type="button" class="line mkit" data-i="' + i + '"><span class="l"><span class="t">' + esc(k.n) + '</span><span class="s">' +
          (k.shop ? 'Shop kit' : 'My kit') + ' &#183; ' + k.lines.length + ' items</span></span><span class="chip">Add</span></button>';
      }).join('');
      kl.classList.remove('hidden');
      $all('.mkit', kl).forEach(function (b) {
        b.onclick = function () {
          var k = kits[+b.getAttribute('data-i')];
          k.lines.forEach(function (l) { w.add(l.n, l.q); });
          kl.classList.add('hidden');
          toast(k.n + ': ' + k.lines.length + ' items added. Change or remove any line.', 3500);
        };
      });
    };
  }
  function shortDate(ds) { var p = String(ds || '').split('-'); return p.length === 3 ? MON[+p[1] - 1] + ' ' + (+p[2]) : ds; }

  /* ---------- Tools > Materials (everyone): cleanup, the list, kits, changes (undo) ---------- */
  var MAT_TABS = [['cleanup', 'Cleanup'], ['list', 'List'], ['kits', 'Kits'], ['log', 'Changes']];
  function matPage(tab, body) {

  function renderMaterials(tab, sub) {

  function matAfter(r, msg) {

  function matListPage(sub) {

            esc([it.mergedInto ? 'merged into ' + it.mergedInto : it.hidden ? 'hidden' : '', it.u, it.k ? 'used ' + it.k + 'x' : 'not used yet'].filter(String).join(' \u00b7 ')) +

  function matEditItem(body, it) {
    var units = (MAT.data && MAT.data.units) || ['ft', 'ea', 'box', 'roll', 'pkg', 'pr', 'bag', 'lb', 'gal', 'set'];
    var merged = it && it.mergedInto;
    body.innerHTML = '<a class="back" href="#tool/materials/list">&#8249; List</a>' +
      '<form id="matItemForm" autocomplete="off"><label class="field" for="miName">Name (what goes on the slip)</label>' +
      '<input type="text" id="miName" maxlength="120" value="' + esc(it ? it.n : '') + '"' + (merged ? ' disabled' : '') + '>' +
      '<label class="field" for="miUnit">Unit (shown on the phone only, never on the slip)</label><select id="miUnit"><option value="">none</option>' +
      units.map(function (u) { return '<option' + (it && it.u === u ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select>' +
      '<label class="field" for="miCat">Category (optional)</label><input type="text" id="miCat" maxlength="40" value="' + esc(it ? it.c : '') + '">' +
      '<label class="field" for="miAl">Other names to find it by (one per line)</label><textarea id="miAl" rows="3">' + esc(it ? it.a.join('\n') : '') + '</textarea>' +
      (it ? '<p class="muted small">' + esc((it.source === 'slip' ? 'Learned from a slip by ' : 'Added by ') + (it.by || '?')) +
        (it.updatedBy ? ' &#183; last changed by ' + esc(it.updatedBy) : '') + '</p>' : '') +
      (merged ? '<div class="note">Merged into ' + esc(it.mergedInto) + '. Undo the merge under Changes to bring it back.</div>'
        : '<button type="submit" class="btn primary big" id="miSave">Save</button>') + '</form>' +
      (it && !merged ? '<button type="button" class="btn block" id="miHide" style="margin-top:8px">' + (it.hidden ? 'Bring it back' : 'Hide from suggestions') + '</button>' +
        '<label class="field" for="miInto" style="margin-top:12px">Merge into another item</label><input type="search" id="miInto" placeholder="Type the other item" autocomplete="off"><div id="miIntoHits"></div>' : '');
    if (merged) return;
    $('#matItemForm').onsubmit = function (ev) {
      ev.preventDefault();
      call('apiMatSave', { id: it ? it.id : '', name: $('#miName').value, unit: $('#miUnit').value, category: $('#miCat').value,
                           aliases: $('#miAl').value.split('\n') }).then(function (r) {
        matAfter(r, r.unchanged ? 'No changes.' : r.unhidden ? 'That item was hidden; it is back now.' : 'Saved. Past slips stay as they were.');
        go('#tool/materials/list');
      }).catch(fail);
    };
    if (!it) return;
    $('#miHide').onclick = function () {
      call('apiMatHide', it.id, !it.hidden).then(function (r) { matAfter(r, it.hidden ? 'It is back in suggestions.' : 'Hidden from suggestions.'); go('#tool/materials/list'); }).catch(fail);
    };
    $('#miInto').oninput = function () {
      var q = matKey(this.value), hits = !q ? [] : (S.matAll || []).filter(function (x) {
        return x.id !== it.id && !x.hidden && !x.mergedInto && matKey(x.n).indexOf(q) >= 0;
      }).slice(0, 5);
      $('#miIntoHits').innerHTML = hits.map(function (x) {
        return '<button type="button" class="line minto" data-id="' + esc(x.id) + '"><span class="l"><span class="t">' + esc(x.n) + '</span></span><span class="chip">Merge</span></button>';
      }).join('');
      $all('#miIntoHits .minto').forEach(function (b) {
        b.onclick = function () {
          if (!window.confirm('Merge "' + it.n + '" into "' + b.textContent.replace(/Merge$/, '') + '"? Past slips stay as they are.')) return;
          call('apiMatMerge', it.id, b.getAttribute('data-id')).then(function (r) { matAfter(r, 'Merged. Undo it under Changes if that was wrong.'); go('#tool/materials/list'); }).catch(fail);
        };
      });
    };
  }

  function matKitsPage(sub) {
    var body = matPage('kits');
    matLoad(true).then(function (d) {
      var kits = d.kits || [];
      if (sub) { var k = kits.filter(function (x) { return x.id === sub; })[0]; if (k || sub === 'new') return matEditKit(body, k || null); }
      body.innerHTML = '<p class="muted small">A kit adds several items to a slip with one tap. Shop kits are for everyone; my kits only show for me.</p>' +
        '<a class="btn primary block" id="kitNew" href="#tool/materials/kits/new">+ New kit</a>' +
        (kits.length ? kits.map(function (k) {
          return '<a class="line" href="#tool/materials/kits/' + esc(k.id) + '"><span class="l"><span class="t">' + esc(k.n) + '</span><span class="s">' +
            (k.shop ? 'Shop kit' : 'My kit') + ' &#183; ' + k.lines.length + ' items</span></span></a>';
        }).join('') : '<p class="muted" id="kitNone">No kits yet.</p>');
    }).catch(function (err) { body.innerHTML = '<p class="muted">' + esc(errMsg(err)) + '</p>'; });
  }
  function matEditKit(body, k) {
    body.innerHTML = '<a class="back" href="#tool/materials/kits">&#8249; Kits</a>' +
      '<form id="kitForm" autocomplete="off"><label class="field" for="kName">Kit name</label><input type="text" id="kName" maxlength="60" value="' + esc(k ? k.n : '') + '">' +
      (k ? '<p class="muted small">' + (k.shop ? 'Shop kit (everyone)' : 'My kit (only me)') + '</p>'
         : '<label class="toggle" for="kShop"><span>Shop kit (everyone sees it)</span><input type="checkbox" id="kShop" checked></label>') +
      '<label class="field">Items</label><div id="kmats"></div><button type="button" class="btn small" id="kAdd">+ Add item</button>' +
      '<button type="submit" class="btn primary big" id="kSave" style="margin-top:12px">Save kit</button></form>' +
      (k ? '<button type="button" class="btn block" id="kDel" style="margin-top:8px">Remove kit</button>' : '');
    var w = matRowsWidget($('#kmats'));
    (k ? k.lines : [{}]).forEach(function (l) { w.add(l.n || '', l.q == null ? '' : l.q, { noBump: true }); });
    $('#kAdd').onclick = function () { w.add('', '', { focus: true, noBump: true }); };
    $('#kitForm').onsubmit = function (ev) {
      ev.preventDefault();
      call('apiMatKitSave', { id: k ? k.id : '', name: $('#kName').value, shop: k ? k.shop : $('#kShop').checked,
                              lines: w.lines().map(function (l) { return { n: l.item, q: l.qty }; }) })
        .then(function (r) { matAfter(r, 'Kit saved.'); go('#tool/materials/kits'); }).catch(fail);
    };
    if (k) $('#kDel').onclick = function () {
      if (!window.confirm('Remove the kit "' + k.n + '"? You can undo it under Changes.')) return;
      call('apiMatKitDelete', k.id).then(function (r) { matAfter(r, 'Kit removed.'); go('#tool/materials/kits'); }).catch(fail);
    };
  }

  function matLogPage() {
    var body = matPage('log');
    call('apiMatLog').then(function (r) {
      body.innerHTML = r.log.length ? '<p class="muted small">Newest first. Undo puts it back the way it was (past slips are never changed).</p>' +
        r.log.map(function (l) {
          return '<div class="line mlog"><span class="l"><span class="t">' + esc(l.summary) + '</span><span class="s">' + esc(l.by) + ' &#183; ' + esc(l.at) +
            (l.undone ? ' &#183; undone by ' + esc(l.undoneBy) : '') + '</span></span>' +
            (l.canUndo ? '<button type="button" class="btn small mundo" data-id="' + esc(l.id) + '">Undo</button>' : '') + '</div>';
        }).join('') : '<p class="muted" id="logNone">No changes yet.</p>';
      $all('.mundo', body).forEach(function (b) {
        b.onclick = function () {
          b.disabled = true;
          call('apiMatUndo', b.getAttribute('data-id')).then(function (x) { matAfter(x, 'Undone.'); matLogPage(); }).catch(function (err) { b.disabled = false; fail(err); });
        };
      });
    }).catch(function (err) { body.innerHTML = '<p class="muted">' + esc(errMsg(err)) + '</p>'; });
  }

  /* ================= My points (v0.7): only my own numbers ================= */
  function renderPoints() {
    app.innerHTML = '<div class="loading">Loading&#x2026;</div>';
    call('apiPoints').then(function (p) {
      S.points = p; drawPill();
      var k = p.streak.count;
      var tiers = p.tiers.map(function (t) {
        var can = p.redemptionsEnabled && p.available >= t.points;
        return '<div class="line tierline"><div class="l"><span class="t">' + esc(t.reward) + '</span><span class="s">' + esc(t.points) + ' points' +
          (p.available < t.points ? ' &#183; ' + esc(t.points - p.available) + ' to go' : '') + '</span></div>' +
          (p.redemptionsEnabled ? '<span class="r"><button type="button" class="btn small redeem" data-id="' + esc(t.id) + '"' + (can ? '' : ' disabled') +
            '>Redeem</button></span>' : '') + '</div>';
      }).join('');
      // v1.1: points come off when you ask; a denied or cancelled request gives them back.
      var REQ_STATUS = { Requested: 'Requested &#183; waiting for review', Approved: 'Approved', Fulfilled: 'Given',
                         Denied: 'Denied &#183; points returned', Cancelled: 'Cancelled &#183; points returned' };
      var reqs = (p.redemptions || []).map(function (r) {
        return '<div class="line reqline"><div class="l"><span class="t">' + esc(r.reward) + ' (' + esc(r.points) + ' pts)</span><span class="s">' +
          (REQ_STATUS[r.status] || esc(r.status)) + ' &#183; ' + esc(r.requestedAt) + (r.note ? ' &#183; ' + esc(r.note) : '') + '</span></div>' +
          (r.status === 'Requested' ? '<span class="r"><button type="button" class="btn small cancelreq" data-id="' + esc(r.id) + '">Cancel</button></span>' : '') + '</div>';
      }).join('');
      app.innerHTML = '<h1>My points</h1><p class="sub">Only you see your points. There are no rankings.</p>' +
        (p.enabled ? '' : '<div class="note warn" id="pointsOff">Points are turned off right now.</div>') +
        '<div class="card bigpts"><div class="ptsbig"><span class="ptsval" id="myBalance">' + esc(p.balance) + '</span><span class="u">points</span></div>' +
        '<div class="muted">Lifetime ' + esc(p.lifetime) + (p.held ? ' &#183; ' + esc(p.held) + ' on an older request' : '') + '</div>' +
        '<div class="streak" id="myStreak">' + (k ? '&#128293; ' + esc(k) + '-day streak' : 'No streak yet') +
        (p.streak.grace ? ' &#183; ' + esc(plural(p.streak.graceLeft, 'grace day')) + ' left this month' : '') + '</div></div>' +
        '<div class="card"><h3>Rewards</h3>' + (p.redemptionsEnabled ? '' :
          '<div class="note" id="trackingOnly">Tracking only for now: your points are counted and kept. ' + esc(S.boot.app.contactNames) + ' will turn on reward requests later.</div>') +
        (tiers || '<p class="muted">No rewards set yet.</p>') + '</div>' +
        (reqs ? '<div class="card"><h3>My requests</h3>' + reqs + '</div>' : '') +
        '<div class="card"><h3>How points work</h3>' + p.rules.filter(function (r) { return r.key !== 'STREAK_GRACE_PER_MONTH'; }).map(function (r) {
          return '<div class="line"><div class="l"><span class="t">' + esc(r.label) + '</span></div><span class="r">+' + esc(r.value) + '</span></div>';
        }).join('') + '<p class="muted small">Log a Work day on the same day you worked it (backdating earns nothing). Sick, vacation and holidays never break a streak. ' +
          esc(plural(p.streak.grace, 'missed workday')) + ' a month is forgiven. Points come only from saved entries and slips.' +
          (p.startDate ? ' Counting since ' + esc(p.startDate) + '.' : '') + '</p></div>' +
        '<div class="card"><h3>History</h3>' + (p.history.length ? p.history.map(function (x) {
          return '<div class="line"><div class="l"><span class="t">' + esc(x.label) + '</span><span class="s">' + esc(x.at) + '</span></div>' +
            '<span class="r">' + (x.pts > 0 ? '+' : '') + esc(x.pts) + '</span></div>';
        }).join('') : '<p class="muted">Nothing yet. Log today\'s time today for your first point.</p>') + '</div>' +
        '<label class="toggle card" for="soundOn"><span>Sound when I earn points</span><input type="checkbox" id="soundOn"' + (muted() ? '' : ' checked') + '></label>';
      $('#soundOn').onchange = function () { if (this.checked) lsDel('mute'); else lsSet('mute', '1'); toast(this.checked ? 'Sound on.' : 'Sound off.'); };
      $all('.redeem').forEach(function (b) {
        b.onclick = function () {
          var t = p.tiers.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
          if (!t) return;
          var noSignal = 'Needs a signal to request a reward';
          if (window.navigator && window.navigator.onLine === false) { toast(noSignal, 4000); return; } // never queued offline
          if (!window.confirm('Use ' + t.points + ' points for ' + t.reward + '? Doug will be emailed.')) return;
          b.disabled = true;
          call('apiRedeem', t.id).then(function (r) {
            toast((r && r.deducted || t.points) + ' points taken off. Your request was sent to Doug.', 5000); renderPoints();
          }).catch(function (err) {
            b.disabled = false;
            if (/^OFFLINE/.test(String(err && err.message || err))) { toast(noSignal, 4000); return; }
            fail(err);
          });
        };
      });
      $all('.cancelreq').forEach(function (b) {
        b.onclick = function () {
          if (!window.confirm('Cancel this request? Your points come back.')) return;
          call('apiCancelRedeem', b.getAttribute('data-id')).then(function () { toast('Request cancelled. Points returned.', 3000); renderPoints(); }).catch(fail);
        };
      });
    }).catch(fail);
  }

  /* ================= Moderator: points, plain table sorted by name (no ranking) ================= */
  function renderModPoints() {
    app.innerHTML = '<div class="loading">Loading&#x2026;</div>';
    call('apiModPoints').then(function (d) {
      app.innerHTML = '<h1>Points</h1><p class="sub">Sorted by name. For admin only: techs see only their own numbers.</p>' +
        (d.enabled ? '' : '<div class="note warn">Points are off (POINTS_ENABLED = No, or no start date). Run setup() once after updating.</div>') +
        '<div class="card"><div class="scroll"><table class="grid" id="modPtsTable"><tr><th>Name</th><th>Points</th><th>Lifetime</th><th>Streak</th></tr>' +
        d.people.map(function (x) {
          return '<tr><td>' + esc(x.name) + '</td><td><b>' + esc(x.balance) + '</b></td><td>' + esc(x.lifetime) + '</td><td>' + esc(x.streak) + '</td></tr>';
        }).join('') + '</table></div>' + (d.startDate ? '<p class="muted small">Counting since ' + esc(d.startDate) + '.</p>' : '') + '</div>' +
        '<form class="card" id="adjForm" autocomplete="off"><h3>Adjust points</h3>' +
        '<label class="field" for="adjWho">Person</label><select id="adjWho">' + d.people.map(function (x) {
          return '<option value="' + esc(x.email) + '">' + esc(x.name) + '</option>'; }).join('') + '</select>' +
        '<label class="field" for="adjPts">Points (+ or -)</label><input type="number" id="adjPts" step="1" placeholder="5 or -5">' +
        '<label class="field" for="adjWhy">Reason (required)</label><input type="text" id="adjWhy" maxlength="200" placeholder="Example: logged on time, phone was dead">' +
        '<button class="btn primary block" type="submit" style="margin-top:12px">Save adjustment</button>' +
        '<p class="muted small">Every adjustment is kept in the points history and the Log.</p></form>' +
        '<a class="btn block" href="#mod-rewards">Rewards and point rules</a>';
      $('#adjForm').onsubmit = function (ev) {
        ev.preventDefault();
        call('apiModAdjustPoints', $('#adjWho').value, $('#adjPts').value, $('#adjWhy').value)
          .then(function () { toast('Points adjusted.'); renderModPoints(); }).catch(fail);
      };
    }).catch(fail);
  }

  /* ================= Moderator: rewards, point rules, requests (dial it in from the phone) ================= */
  function renderModRewards() {
    app.innerHTML = '<div class="loading">Loading&#x2026;</div>';
    call('apiModRewards').then(function (d) {
      function tierForm(t) {
        return '<form class="tierf" data-id="' + esc(t.id) + '" autocomplete="off"><div class="grid2">' +
          '<div><label class="field">Points</label><input type="number" name="pts" min="1" step="1" value="' + esc(t.points) + '"></div>' +
          '<div><label class="field">Rough $ value</label><input type="number" name="val" min="0" step="1" value="' + esc(t.estValue == null ? '' : t.estValue) + '"></div></div>' +
          '<label class="field">Reward</label><input type="text" name="reward" maxlength="80" value="' + esc(t.reward) + '">' +
          '<label class="toggle"><span>Active (techs can see it)</span><input type="checkbox" name="active"' + (t.active ? ' checked' : '') + '></label>' +
          '<div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn tup" type="button" aria-label="Move up">&#8593;</button>' +
          '<button class="btn tdown" type="button" aria-label="Move down">&#8595;</button><button class="btn danger trm" type="button">Remove</button></div></form>';
      }
      app.innerHTML = '<h1>Rewards and point rules</h1><p class="sub">Changes apply going forward. Points already given stay.</p>' +
        '<div class="card"><div class="card-head"><h3>Reward requests</h3><span class="chip ' + (d.redemptionsEnabled ? 'solid' : '') + '" id="redeemState">' +
          (d.redemptionsEnabled ? 'On' : 'Tracking only') + '</span></div>' +
        '<p class="muted small">' + (d.redemptionsEnabled ? 'Techs can request a reward when they have the points. The points come off right away and Doug gets an email. Deny gives them back.'
          : 'Points are counted and shown, but nobody can request a reward yet.') + '</p>' +
        '<button class="btn block" id="toggleRedeem">' + (d.redemptionsEnabled ? 'Back to tracking only' : 'Turn on reward requests') + '</button></div>' +
        '<div class="card"><h3>Reward tiers</h3><div id="tierList">' + (d.tiers.length ? d.tiers.map(tierForm).join('<hr>') : '<p class="muted">No tiers.</p>') + '</div></div>' +
        '<form class="card" id="addTier" autocomplete="off"><h3>Add a reward</h3><div class="grid2">' +
          '<div><label class="field" for="ntPts">Points</label><input type="number" id="ntPts" min="1" step="1"></div>' +
          '<div><label class="field" for="ntVal">Rough $ value</label><input type="number" id="ntVal" min="0" step="1"></div></div>' +
          '<label class="field" for="ntReward">Reward</label><input type="text" id="ntReward" maxlength="80" placeholder="Example: $100 gift card">' +
          '<button class="btn primary block" type="submit" style="margin-top:12px">Add reward</button></form>' +
        '<div class="card"><h3>Point rules</h3>' + d.rules.map(function (r) {
          return '<form class="rulef" data-k="' + esc(r.key) + '"><label class="field">' + esc(r.label) + '</label><div class="row">' +
            '<input type="number" name="v" min="0" step="1" value="' + esc(r.value) + '" style="flex:1"><button class="btn small" type="submit">Save</button></div>' +
            '<div class="muted small">Default ' + esc(r.dflt) + '. 0 turns it off.</div></form>';
        }).join('') +
        '<form class="rulef" data-k="POINTS_HOLIDAYS"><label class="field">Company holidays (not required workdays)</label><div class="row">' +
          '<input type="text" name="v" value="' + esc(d.holidays) + '" placeholder="2026-11-26, 2026-12-25" style="flex:1"><button class="btn small" type="submit">Save</button></div></form>' +
        '<form class="rulef" data-k="POINTS_START_DATE"><label class="field">Points counted since</label><div class="row">' +
          '<input type="date" name="v" value="' + esc(d.startDate) + '" style="flex:1"><button class="btn small" type="submit">Save</button></div></form>' +
        '<p class="muted small">Nightly check (about 12:30 AM): ' + (d.trigger ? 'installed' : 'not installed, run setup() in the editor') + '.</p></div>' +
        '<div class="card"><h3>Open requests</h3>' + (d.open.length ? d.open.map(function (r) {
          return '<div class="req" data-id="' + esc(r.id) + '"><div class="line"><div class="l"><span class="t">' + esc(r.name) + ': ' + esc(r.reward) + '</span>' +
            '<span class="s">' + esc(r.points) + ' pts (already taken off) &#183; ' + esc(r.status) + ' &#183; ' + esc(r.requestedAt) + '</span></div></div>' +
            '<input type="text" class="rnote" maxlength="200" placeholder="Note (optional, no card numbers)"><div class="actions">' +
            (r.status === 'Requested' ? '<button class="btn primary rdo" data-a="approve" type="button">Approve</button><button class="btn rdo" data-a="deny" type="button">Deny</button>'
              : '<button class="btn primary rdo" data-a="fulfill" type="button">Mark given</button>') + '</div></div>';
        }).join('') : '<p class="muted">None.</p>') +
        (d.recent.length ? '<details><summary class="linklike">Past requests</summary>' + d.recent.map(function (r) {
          return '<div class="muted small">' + esc(r.requestedAt) + ' ' + esc(r.name) + ': ' + esc(r.reward) + ' (' + esc(r.points) + ') ' + esc(r.status) + '</div>';
        }).join('') + '</details>' : '') + '</div>';
      $('#toggleRedeem').onclick = function () {
        var to = d.redemptionsEnabled ? 'No' : 'Yes';
        if (to === 'Yes' && !window.confirm('Turn on reward requests? Techs will see a Redeem button on rewards they can afford.')) return;
        call('apiModSaveSetting', 'REDEMPTIONS_ENABLED', to).then(function () { toast('Saved.'); renderModRewards(); }).catch(fail);
      };
      $all('form.tierf').forEach(function (f) {
        var id = f.getAttribute('data-id');
        f.onsubmit = function (ev) {
          ev.preventDefault();
          call('apiModSaveTier', { id: id, points: fld(f, 'pts').value, reward: fld(f, 'reward').value, estValue: fld(f, 'val').value, active: fld(f, 'active').checked })
            .then(function () { toast('Reward saved.'); renderModRewards(); }).catch(fail);
        };
        $('.tup', f).onclick = function () { call('apiModMoveTier', id, -1).then(renderModRewards).catch(fail); };
        $('.tdown', f).onclick = function () { call('apiModMoveTier', id, 1).then(renderModRewards).catch(fail); };
        $('.trm', f).onclick = function () {
          if (!window.confirm('Remove this reward? Requests already made keep their record.')) return;
          call('apiModRemoveTier', id).then(function () { toast('Removed.'); renderModRewards(); }).catch(fail);
        };
      });
      $('#addTier').onsubmit = function (ev) {
        ev.preventDefault();
        call('apiModSaveTier', { points: $('#ntPts').value, reward: $('#ntReward').value, estValue: $('#ntVal').value, active: true })
          .then(function () { toast('Reward added.'); renderModRewards(); }).catch(fail);
      };
      $all('form.rulef').forEach(function (f) {
        f.onsubmit = function (ev) {
          ev.preventDefault();
          call('apiModSaveSetting', f.getAttribute('data-k'), fld(f, 'v').value).then(function () { toast('Saved. Applies going forward.'); renderModRewards(); }).catch(fail);
        };
      });
      $all('.req').forEach(function (el) {
        $all('.rdo', el).forEach(function (b) {
          b.onclick = function () {
            var a = b.getAttribute('data-a');
            if (a === 'deny' && !window.confirm('Deny this request? The points go back to them and they get an email.')) return;
            call('apiModDecideRedemption', el.getAttribute('data-id'), a, $('.rnote', el).value)
              .then(function () { toast(a === 'deny' ? 'Denied. Points returned.' : a === 'approve' ? 'Approved. They get an email.' : 'Saved.', 3000); renderModRewards(); }).catch(fail);
          };
        });
      });
    }).catch(fail);
  }

  start();
})();
</script>

</body>
</html>
